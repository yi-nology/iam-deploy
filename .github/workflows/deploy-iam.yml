name: Deploy IAM
run-name: Deploy IAM (${{ inputs.release_tag }})

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Immutable release tag produced by build-iam.yml (e.g. iam-20260806094500-abcd1234). Must already exist on GHCR for both iam-server and iam-web.'
        required: true
        type: string
      iam_server_ref:
        description: 'iam-server ref recorded in the build (informational only)'
        required: false
        default: 'main'
        type: string
      iam_web_ref:
        description: 'iam-web ref recorded in the build (informational only)'
        required: false
        default: 'main'
        type: string
      skip_health_check:
        description: 'Skip health check and auto-rollback (dangerous; only for debug)'
        required: false
        default: false
        type: boolean

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: yi-nology
  REMOTE_DIR: /opt/iam
  REMOTE_USER: zhangyi
  SUDO_GROUP: 'sudo'

jobs:
  deploy:
    name: Deploy to 215
    runs-on: self-hosted
    timeout-minutes: 20
    steps:
      - name: Show environment
        shell: bash
        run: |
          set -euo pipefail
          echo "## Environment" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Runner: \`$(uname -a)\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Working dir: \`$(pwd)\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Effective user: \`$(whoami)\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Deploy target: \`$REMOTE_USER@${{ env.REMOTE_DIR }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- iam-server ref: \`${{ inputs.iam_server_ref }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- iam-web ref: \`${{ inputs.iam_web_ref }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Release tag: \`${{ inputs.release_tag }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Tooling" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          sudo -n -E docker --version >> "$GITHUB_STEP_SUMMARY" 2>&1 || echo "docker: UNAVAILABLE" >> "$GITHUB_STEP_SUMMARY"
          sudo -n -E docker compose version >> "$GITHUB_STEP_SUMMARY" 2>&1 || echo "docker compose: UNAVAILABLE" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Validate release tag
        shell: bash
        env:
          TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          tag="$TAG"
          [[ "$tag" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$ ]] \
            || { echo "ERROR: invalid tag '$tag' (allowed: [A-Za-z0-9._-], 1-128 chars, must start with alnum)"; exit 1; }
          [[ "$tag" != "main" && "$tag" != "latest" ]] \
            || { echo "ERROR: tag must be immutable, not 'main' or 'latest'"; exit 1; }
          echo "Release tag OK: $tag"

      - name: Login to GHCR
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
        run: |
          set -euo pipefail
          : "${GHCR_TOKEN:?GHCR_TOKEN secret is required}"
          : "${GHCR_USERNAME:?GHCR_USERNAME secret is required}"

          # Use an isolated DOCKER_CONFIG so we never leak the token into the runner's persistent home.
          docker_cfg="$(mktemp -d)"
          export DOCKER_CONFIG="$docker_cfg"

          # The 215 self-hosted runner sits behind a proxy that re-signs ghcr.io with a private CA
          # (/etc/docker/certs.d/ghcr.io/ca.crt on the host). When we point DOCKER_CONFIG at a
          # fresh tempdir, the docker CLI no longer finds that cert in `$DOCKER_CONFIG/certs.d/`
          # and the registry handshake fails with `x509: certificate signed by unknown authority`.
          # Mirror the cert into the tempdir so any docker CLI invocation that talks to ghcr.io
          # from this job uses the same trust chain that works on the host.
          # Docker resolves the CA directory differently across CLI/daemon versions;
          # mirror both the host-only and host:port forms for ghcr.io.
          mkdir -p "$DOCKER_CONFIG/certs.d/ghcr.io" "$DOCKER_CONFIG/certs.d/ghcr.io:443"
          if [[ -f /etc/docker/certs.d/ghcr.io/ca.crt ]]; then
            sudo -n cp /etc/docker/certs.d/ghcr.io/ca.crt "$DOCKER_CONFIG/certs.d/ghcr.io:443/ca.crt"
            sudo -n cp /etc/docker/certs.d/ghcr.io/ca.crt "$DOCKER_CONFIG/certs.d/ghcr.io/ca.crt"
          fi

          # Write the credentials blob directly rather than calling `docker login`, which fails
          # the same TLS handshake for the same reason. Public iam-server / iam-web packages
          # pull without auth, but writing the blob keeps the setup ready for private packages
          # and matches what `docker login` would persist.
          b64="$(printf '%s:%s' "$GHCR_USERNAME" "$GHCR_TOKEN" | base64 | tr -d '\n')"
          printf '{"auths":{"%s":{"auth":"%s"}}}' "$REGISTRY" "$b64" \
            | sudo -n tee "$DOCKER_CONFIG/config.json" >/dev/null
          sudo -n chmod 600 "$DOCKER_CONFIG/config.json"

          echo "DOCKER_CONFIG=$docker_cfg" >> "$GITHUB_ENV"
          echo "Wrote GHCR credentials + cert mirror to ephemeral DOCKER_CONFIG"

      - name: Verify both images exist on GHCR
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          for svc in iam-server iam-web; do
            image="$REGISTRY/$IMAGE_PREFIX/${svc}:${RELEASE_TAG}"
            echo "Inspecting $image"
            sudo -n env "DOCKER_CONFIG=$DOCKER_CONFIG" docker manifest inspect "$image" >/dev/null \
              || { echo "ERROR: manifest not found for $image"; exit 1; }
          done

      - name: Pull both images
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          for svc in iam-server iam-web; do
            image="$REGISTRY/$IMAGE_PREFIX/${svc}:${RELEASE_TAG}"
            sudo -n env "DOCKER_CONFIG=$DOCKER_CONFIG" docker pull --platform linux/amd64 "$image"
            platform="$(sudo -n env "DOCKER_CONFIG=$DOCKER_CONFIG" docker image inspect --format '{{.Os}}/{{.Architecture}}' "$image")"
            [[ "$platform" == "linux/amd64" ]] \
              || { echo "ERROR: $image resolved to $platform, expected linux/amd64"; exit 1; }
          done

      - name: Preflight
        shell: bash
        run: |
          set -euo pipefail
          sudo -n bash -s <<'PFLIGHT'
          set -euo pipefail
          dir="/opt/iam"
          [[ -f "$dir/docker-compose.yml" ]] || { echo "ERROR: missing $dir/docker-compose.yml"; exit 1; }
          [[ -f "$dir/.env" ]] || { echo "ERROR: missing $dir/.env"; exit 1; }
          server_id="$(sudo -n env "DOCKER_CONFIG=$DOCKER_CONFIG" docker compose -f "$dir/docker-compose.yml" ps -q iam-server | head -n 1)"
          web_id="$(sudo -n env "DOCKER_CONFIG=$DOCKER_CONFIG" docker compose -f "$dir/docker-compose.yml" ps -q iam-web | head -n 1)"
          [[ -n "$server_id" ]] || { echo "ERROR: iam-server is not running, refusing to deploy without a rollback target"; exit 1; }
          [[ -n "$web_id" ]] || { echo "ERROR: iam-web is not running, refusing to deploy without a rollback target"; exit 1; }
          echo "Preflight OK: iam-server=$server_id iam-web=$web_id"
          PFLIGHT

      - name: Switch image overlay
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          sudo -n bash -s <<'OVERLAY'
          set -euo pipefail
          dir="/opt/iam"
          release_tag="$RELEASE_TAG"
          history_dir="$dir/.deploy-history"
          ts="$(date -u +%Y%m%d-%H%M%S)"
          mkdir -p "$history_dir"

          # Backup current overlay so we can roll back.
          if [[ -f "$dir/.iam-images.env" ]]; then
            cp "$dir/.iam-images.env" "$history_dir/${ts}.iam-images.env.pre"
          fi
          if [[ -f "$dir/.iam-deploy-images.yml" ]]; then
            cp "$dir/.iam-deploy-images.yml" "$history_dir/${ts}.overlay.pre"
          fi

          # Write new env and overlay.
          cat > "$dir/.iam-images.env" <<EOF
          IAM_SERVER_IMAGE=ghcr.io/yi-nology/iam-server:${release_tag}
          IAM_WEB_IMAGE=ghcr.io/yi-nology/iam-web:${release_tag}
          EOF

          cat > "$dir/.iam-deploy-images.yml" <<'YML'
          services:
            iam-server:
              image: "${IAM_SERVER_IMAGE:?IAM_SERVER_IMAGE must be set}"
            iam-web:
              image: "${IAM_WEB_IMAGE:?IAM_WEB_IMAGE must be set}"
          YML

          echo "Overlay updated:"
          cat "$dir/.iam-images.env"
          echo "---"
          cat "$dir/.iam-deploy-images.yml"
          OVERLAY

      - name: Restart IAM services
        shell: bash
        run: |
          set -euo pipefail
          sudo -n bash -s <<'RESTART'
          set -euo pipefail
          dir="/opt/iam"
          compose() {
            sudo -n env "DOCKER_CONFIG=$DOCKER_CONFIG" docker compose \
              --env-file "$dir/.env" \
              --env-file "$dir/.iam-images.env" \
              -f "$dir/docker-compose.yml" \
              -f "$dir/.iam-deploy-images.yml" \
              "$@"
          }
          compose up -d --no-build --pull never iam-server iam-web
          RESTART

      - name: Health check
        if: ${{ !inputs.skip_health_check }}
        id: healthcheck
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          sudo -n bash -s <<'HC'
          set -euo pipefail
          dir="/opt/iam"
          release_tag="$RELEASE_TAG"
          history_dir="$dir/.deploy-history"
          ts="$(date -u +%Y%m%d-%H%M%S)"

          compose() {
            sudo -n env "DOCKER_CONFIG=$DOCKER_CONFIG" docker compose \
              --env-file "$dir/.env" \
              --env-file "$dir/.iam-images.env" \
              -f "$dir/docker-compose.yml" \
              -f "$dir/.iam-deploy-images.yml" \
              "$@"
          }

          healthy() {
            local server_id status binding web_port
            server_id="$(compose ps -q iam-server)"
            [[ -n "$server_id" ]] || return 1
            status="$(sudo -n env "DOCKER_CONFIG=$DOCKER_CONFIG" docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$server_id")"
            [[ "$status" == healthy ]] || return 1
            sudo -n curl -fsS --max-time 5 http://127.0.0.1:8000/health >/dev/null || return 1
            binding="$(compose port iam-web 80 | head -n 1)"
            [[ -n "$binding" ]] || return 1
            web_port="${binding##*:}"
            sudo -n curl -fsS --max-time 5 "http://127.0.0.1:${web_port}/" \
              | head -c 500 | grep -qi '<html'
          }

          rollback() {
            local prev_env
            prev_env="$(ls -1t "$dir/.deploy-history"/*.iam-images.env.pre 2>/dev/null | head -n 1 || true)"
            if [[ -z "$prev_env" || ! -f "$prev_env" ]]; then
              echo "No previous overlay to roll back to" >&2
              return 1
            fi
            echo "Rolling back to $prev_env" >&2
            cp "$prev_env" "$dir/.iam-images.env"
            compose up -d --no-build --pull never iam-server iam-web
          }

          deployment_ok=false
          for i in $(seq 1 12); do
            if healthy; then
              echo "Healthy on attempt $i"
              deployment_ok=true
              break
            fi
            echo "Health check $i/12: not healthy yet, sleeping 5s"
            sleep 5
          done

          if [[ "$deployment_ok" != true ]]; then
            echo "Deployment failed health check, attempting rollback"
            if rollback; then
              for i in $(seq 1 12); do
                if healthy; then
                  echo "Rollback succeeded on attempt $i"
                  printf '%s %s FAIL_ROLLED_BACK\n' "$ts" "$release_tag" >> "$history_dir/history.log"
                  exit 3
                fi
                sleep 5
              done
            fi
            printf '%s %s FAIL_ROLLBACK_FAILED\n' "$ts" "$release_tag" >> "$history_dir/history.log"
            echo "ERROR: deployment failed and rollback did not restore health" >&2
            exit 4
          fi

          printf '%s %s OK\n' "$ts" "$release_tag" >> "$history_dir/history.log"
          echo "Deployment OK: $release_tag"
          HC

      - name: Roll back to previous overlay
        if: ${{ inputs.skip_health_check == false && steps.healthcheck.outcome == 'failure' }}
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          sudo -n bash -s <<'RB'
          set -euo pipefail
          dir="/opt/iam"
          release_tag="$RELEASE_TAG"
          history_dir="$dir/.deploy-history"
          ts="$(date -u +%Y%m%d-%H%M%S)"

          prev_env="$(ls -1t "$dir/.deploy-history"/*.iam-images.env.pre 2>/dev/null | head -n 1 || true)"
          if [[ -z "$prev_env" || ! -f "$prev_env" ]]; then
            echo "No previous overlay to roll back to" >&2
            exit 1
          fi
          echo "Rolling back to $prev_env"
          cp "$prev_env" "$dir/.iam-images.env"
          sudo -n env "DOCKER_CONFIG=$DOCKER_CONFIG" docker compose \
            --env-file "$dir/.env" \
            --env-file "$dir/.iam-images.env" \
            -f "$dir/docker-compose.yml" \
            -f "$dir/.iam-deploy-images.yml" \
            up -d --no-build --pull never iam-server iam-web
          printf '%s %s FAIL_HEALTHCHECK_ROLLED_BACK\n' "$ts" "$release_tag" >> "$history_dir/history.log"
          RB

      - name: Cleanup
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${DOCKER_CONFIG:-}" && -d "${DOCKER_CONFIG}" ]]; then
            rm -rf "${DOCKER_CONFIG}"
            echo "Removed ephemeral DOCKER_CONFIG ${DOCKER_CONFIG}"
          fi

      - name: Summary
        if: always()
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          sudo -n bash -s <<'SUMMARY' || true
          set -euo pipefail
          dir="/opt/iam"
          echo "## Deploy summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Release tag: \`$RELEASE_TAG\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Outcome: \`${{ inputs.skip_health_check == true && 'SKIPPED_HEALTH_CHECK' || job.status }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Current container status" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          sudo -n -E docker compose \
            --env-file "$dir/.env" \
            --env-file "$dir/.iam-images.env" \
            -f "$dir/docker-compose.yml" \
            -f "$dir/.iam-deploy-images.yml" \
            ps 2>&1 >> "$GITHUB_STEP_SUMMARY" || echo "(compose ps failed)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Active image references" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat "$dir/.iam-images.env" 2>&1 >> "$GITHUB_STEP_SUMMARY" || echo "(missing)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Recent history" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -n 10 "$dir/.deploy-history/history.log" 2>&1 >> "$GITHUB_STEP_SUMMARY" || echo "(empty)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          SUMMARY
